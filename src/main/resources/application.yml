spring:
  profiles:
    active: local
  application:
    name: movie-ticket-booking-system
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # JSON API only; without this, unknown paths go to the static resource handler and skip our error advice
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/moviebooking
    username: postgres
    password: alex@123
