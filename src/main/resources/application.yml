spring:
  application:
    name: movie-ticket-booking-system
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # JSON API only; without this, unknown paths go to the static resource handler and skip our error advice
      add-mappings: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false                        # Flyway owns event_publication
      republish-outstanding-events-on-restart: true
  mail:
    host: localhost
    port: 1025                                  # Mailpit; every email shows up at http://localhost:8025
  datasource:                                   # docker-compose's database; override with env vars
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moviebooking}
    username: ${DB_USERNAME:moviebooking}
    password: ${DB_PASSWORD:moviebooking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  pattern:
    correlation: "[%X{requestId:-},%X{userId:-}] "   # request and caller ids; empty for scheduled jobs
  level:
    # Hibernate warns on every constraint violation, including the ones we turn into 409s on purpose
    # (show overlap ...). Real failures are still logged by GlobalExceptionHandler.
    org.hibernate.orm.jdbc.error: error
    # Lettuce looks for a macOS-native DNS resolver it doesn't need; we only ever resolve the Redis host
    io.netty.resolver.dns.DnsServerAddressStreamProviders: error
web:
  cors:
    # the local UI prototypes (prototype/, served on 5500); leave empty where a gateway serves one origin
    allowed-origins: http://localhost:5500,http://127.0.0.1:5500
jobs:
  enabled: true                                 # scheduled jobs; tests switch them off and run them by hand
booking:
  cleaning-buffer: PT20M
  late-night-cutoff: "03:00"
  booking-cutoff: PT10M
  date-strip-days: 7
  filling-fast-percent: 20
  slots:
    MORNING:   { from: "03:00", to: "12:00" }
    AFTERNOON: { from: "12:00", to: "16:00" }
    EVENING:   { from: "16:00", to: "20:00" }
    NIGHT:     { from: "20:00", to: "03:00" }   # ends next day, so it includes the late-night shows
  cache:
    show-day-ttl: PT60S
    seat-counter-ttl: PT10M
  hold-duration: PT8M
  payment-window: PT5M
  payment-grace: PT2M                           # a pending payment gets this long past its window before it expires
  cancellation-cutoff: PT30M
  reminder-lead-time: PT2H
  max-seats-per-booking: 10
  convenience-fee-paise: 2000     # ₹20 per seat
  gst-percent: 18
  idempotency-retention: PT24H
  payment:
    simulated-delay: PT15S                      # how long a DELAYED simulated payment takes to succeed
    net-banking-banks: [HDFC, ICICI, SBI, AXIS, KOTAK]
    wallets: [PAYTM, PHONEPE, AMAZONPAY]
