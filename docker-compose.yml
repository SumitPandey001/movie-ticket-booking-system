services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: moviebooking
      POSTGRES_USER: moviebooking
      POSTGRES_PASSWORD: moviebooking
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviebooking"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"                             # SMTP
      - "8025:8025"                             # web UI
